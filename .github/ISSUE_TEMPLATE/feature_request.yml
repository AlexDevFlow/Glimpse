name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first. The solution may turn out to be a different one.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
