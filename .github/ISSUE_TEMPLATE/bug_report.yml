name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glimpse version
      description: Open Glimpse, then the ☰ menu in the top right of its window → About Glimpse. If you built it yourself, say so and give the commit.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Downloaded a release
        - Built from source
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        Please paste it for any recording or screenshot problem, including one
        where nothing failed but the result was wrong: the writer and audio
        formats are recorded there and usually settle it. Get it with:
        tail -n 50 ~/Library/Logs/Glimpse.log
      render: text
  - type: textarea
    id: sound
    attributes:
      label: If sound is missing
      description: >
        Which sound: desktop audio, the microphone, or both? Does it play in
        QuickTime but disappear after uploading somewhere? Was the microphone
        switch on before you pressed Record?
